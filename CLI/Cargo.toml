[package]
name = "ninja-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
documentation = "https://ninja-rs.vercel.app/docs/reference/cli"
repository = "https://github.com/tunafysh/ninja"
readme = "./README.md"

[[bin]]
path = "src/main.rs"   
name = "shurikenctl"

[dependencies]
clap = { version = "4.5.37", default-features = false, features = ["cargo", "derive", "help"] }
owo-colors = { version = "4.2.0", default-features = false, features = ["supports-color"] }
tokio = { version = "1.45.1", default-features = false, features = ["rt-multi-thread"] }
log = { version = "0.4.27", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "env-filter", "time"] }
tracing-appender = { version = "0.2.3", default-features = false }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }
ninja-core = { path = "../core" }
ninja-mcp = { path = "../MCP" }
clap-verbosity-flag = { version = "3.0.3", default-features = true }
serde = { version = "1.0.219", default-features = false }
toml = { version = "1.1.2", default-features = false, features = ["display", "serde"] }
dialoguer = { version = "0.12.0", default-features = false }
ninja-http = { path = "../HTTP" }
serde_json = "1.0.145"
anyhow = "1.0.104"
dirs-next = "2.0.0"
indicatif = { version = "0.18.4", default-features = false }
